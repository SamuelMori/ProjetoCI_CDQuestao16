name: "CI · Build & Test"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build estático
        run: |
          echo "[BUILD] Construindo site estático"
          test -f index.html

  test:
    name: "Testes"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Testes (placeholder)
        run: |
          echo "[TEST] Executando testes unitários simulados"
          echo "OK"
